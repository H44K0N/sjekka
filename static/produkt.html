<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sjekka – Produkt</title>
    <meta name="theme-color" content="#0d0c0b">
    <meta name="description" content="Se hva varen koster i hver butikk.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sjekka">
    <meta property="og:title" content="Sjekka – Produkt">
    <meta property="og:description" content="Se hva varen koster i hver butikk.">
    <meta property="og:url" content="https://sjekka.tischbein.dev/">
    <meta property="og:image" content="https://sjekka.tischbein.dev/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="top">
        <a href="/" class="mark">sjekka</a>
        <nav>
            <a href="/">utforsk</a>
            <a href="/tilbud.html">tilbud</a>
            <a href="/handleliste.html">handleliste <span class="list-count" data-list-count hidden></span></a>
            <a href="/upload.html" class="cta">last opp</a>
        </nav>
    </header>

    <main class="product">
        <section>
            <p class="meta"><a href="/" class="back">← Alle produkter</a><span id="category"></span></p>
            <h1 id="name">…</h1>
            <p class="lede" id="summary"></p>
            <div class="best" id="best" hidden>
                <span class="label">Billigst nå</span>
                <span class="best-row"><span id="best-chain"></span><b id="best-price"></b><span id="best-unit"></span></span>
            </div>
            <div class="product-actions" id="product-actions" hidden>
                <button type="button" class="button" id="list-button">Legg på handlelisten</button>
                <a class="text-link" id="list-link" href="/handleliste.html" hidden>Se hvor listen er billigst <span class="arrow">→</span></a>
            </div>
        </section>

        <section class="offers-now" id="offers-now" hidden>
            <h2 class="label">På tilbud nå</h2>
            <ul id="offers-list"></ul>
        </section>

        <section class="stores-section" id="stores-section" hidden>
            <h2 class="label">Pris per butikk</h2>
            <p class="label scale-note" id="scale-note"></p>
            <ol class="stores" id="stores"></ol>
            <div class="axis" id="axis" aria-hidden="true"><span></span><span></span></div>
            <details class="fold history">
                <summary>Alle registrerte priser</summary>
                <table>
                    <thead><tr><th>Dato</th><th>Butikk</th><th>Vare</th><th>Pris</th><th>Enhetspris</th></tr></thead>
                    <tbody id="history"></tbody>
                </table>
            </details>
        </section>

        <p class="notice" id="notice">Henter priser …</p>
        <div class="tip" id="tip" role="tooltip" hidden></div>
    </main>

    <footer>
        <span>sjekka · <a href="/personvern.html">personvern</a> · <a href="/om.html">om</a></span>
        <span>Har du sjekka i dag?</span>
    </footer>

    <script src="/common.js"></script>
    <script src="/chains.js"></script>
    <script src="/list.js"></script>
    <script>
        const name = new URLSearchParams(location.search).get("navn");
        const $ = id => document.getElementById(id);

        const each = p => p.pack_size > 1 ? p.total_price / p.pack_size : p.total_price;
        // Loose produce (bananas by weight) is priced and compared per kilo:
        // one receipt's 1,57 kg says nothing about what the next shopper pays
        let weighed = false;
        // What prices are compared on: per 100 g/ml (or per kg) or per item, else the price of one
        const comparable = p => weighed ? p.price_per_unit * 10 : p.price_per_unit ?? each(p);
        const unitLabel = p => weighed ? "kr / kg" : p.price_per_unit != null && (p.unit === "g" || p.unit === "ml")
            ? `kr / 100 ${p.unit}` : p.unit === "stk" ? "kr / stk" : "kr";
        // The price as paid, or the kilo price for what was weighed
        const amount = p => weighed && p.by_weight ? `${kr.format(comparable(p))} kr / kg` : `${kr.format(each(p))} kr`;
        let cheapest = null;  // the cheapest store's latest price, once loaded
        // A price this many days old still says what something costs now
        const RECENT_DAYS = 90;
        const day = p => p.purchase_date ? new Date(p.purchase_date).getTime() : null;

        // Any product can go on the list, also one only seen in this week's flyers
        function listButton(productName) {
            $("product-actions").hidden = false;
            const showListed = () => {
                const on = ShoppingList.has(productName);
                // The label says the state, so it isn't also a pressed toggle
                $("list-button").classList.toggle("on", on);
                $("list-button").textContent = on ? "På handlelisten ✓" : "Legg på handlelisten";
                $("list-button").title = on ? "Trykk for å ta den av listen" : "";
                $("list-link").hidden = !on;
            };
            $("list-button").addEventListener("click", () => {
                if (ShoppingList.has(productName)) ShoppingList.remove(productName);
                else ShoppingList.add(productName);
                showListed();
            });
            showListed();
        }

        function render(product) {
            document.title = `Sjekka – ${product.canonical_name}`;
            $("name").textContent = product.canonical_name;
            if (product.category) $("category").textContent = ` · ${product.category}`;

            listButton(product.canonical_name);

            const prices = product.prices.filter(p => p.total_price != null);
            receipts = prices;
            weighed = prices.some(p => p.by_weight) && prices.every(p => p.unit === "g" && p.price_per_unit != null);
            const byStore = new Map();
            for (const p of prices) {
                const key = p.store_chain || "Ukjent butikk";
                if (!byStore.has(key)) byStore.set(key, []);
                byStore.get(key).push(p);
            }
            // Latest price per store, cheapest first
            const stores = [...byStore].map(([chain, list]) => ({ chain, list, latest: list[list.length - 1] }))
                .sort((a, b) => comparable(a.latest) - comparable(b.latest));

            const n = prices.length, s = stores.length;
            $("summary").textContent = `${n} ${n === 1 ? "registrert pris" : "registrerte priser"} fra ${s} ${s === 1 ? "butikk" : "butikker"}.`;
            $("notice").hidden = true;
            if (!stores.length) return;

            cheapest = stores[0].latest;
            $("best").hidden = false;
            // An old price isn't what it costs now: say when it was seen
            const age = cheapest.purchase_date ? (Date.now() - new Date(cheapest.purchase_date)) / 864e5 : Infinity;
            $("best").querySelector(".label").textContent = age <= RECENT_DAYS ? "Billigst nå" : "Billigst sist vi så";
            $("best-chain").replaceChildren(chainBadge(stores[0].chain));
            // Stores selling different sizes are ranked per 100 g/ml, so lead
            // with that: "29,90 kr" for 1,75 l is cheaper than 21,90 kr for 1 l
            const sizes = new Set(stores.map(st => `${st.latest.quantity} ${st.latest.unit}`));
            const perUnit = !weighed && sizes.size > 1 && cheapest.price_per_unit != null && cheapest.unit !== "stk";
            $("best-price").textContent = perUnit ? `${kr.format(comparable(cheapest))} ${unitLabel(cheapest)}` : amount(cheapest);
            const unit = weighed && cheapest.by_weight ? `${packSize(cheapest)} for ${kr.format(cheapest.total_price)} kr`
                : perUnit ? `${amount(cheapest)} for ${packSize(cheapest)}`
                : cheapest.price_per_unit != null ? `${kr.format(comparable(cheapest))} ${unitLabel(cheapest)}` : "";
            $("best-unit").textContent = [unit, cheapest.purchase_date && daysAgo(cheapest.purchase_date)].filter(Boolean).join(" · ");

            // Shared axes for every store's timeline, so the rows compare directly
            const days = prices.map(day).filter(Boolean);
            let t0 = Math.min(...days), t1 = Math.max(...days);
            if (t1 - t0 < 7 * 864e5) { t0 -= 3.5 * 864e5; t1 += 3.5 * 864e5; }
            const values = prices.map(comparable);
            let v0 = Math.min(...values), v1 = Math.max(...values);
            const pad = Math.max((v1 - v0) * 0.15, v1 * 0.05);
            v0 -= pad; v1 += pad;
            $("scale-note").textContent = `Tidslinjene viser ${unitLabel(cheapest)}, med lik skala for alle butikker`;
            const fmtDate = t => new Date(t).toLocaleDateString("nb-NO", { day: "numeric", month: "short" });
            $("axis").children[0].textContent = fmtDate(t0);
            $("axis").children[1].textContent = fmtDate(t1);
            // One price makes a lone dot, not a trend: leave the timelines out
            const trend = prices.length > 1;
            $("axis").hidden = $("scale-note").hidden = !trend;

            $("stores").replaceChildren(...stores.map((store, i) => {
                const p = store.latest;
                const row = el("li", i === 0 ? "store cheapest" : "store");
                const who = el("div", "who");
                who.append(chainBadge(store.chain));
                const about = describe(p);
                if (about) who.append(el("span", "brand", about));
                const price = el("div", "amount");
                price.append(el("b", "", amount(p)));
                const diff = comparable(p) - comparable(cheapest);
                // With one store there's nothing to be cheapest of
                price.append(el("span", "", stores.length === 1 ? "" : i === 0 ? "billigst" : diff < 0.005 ? "samme pris" : `+${kr.format(diff)} ${unitLabel(p)}`));
                row.append(who, price, trend ? timeline(store.list, [t0, t1], [v0, v1]) : el("span"), el("span", "when", daysAgo(p.purchase_date)));
                return row;
            }));

            $("history").replaceChildren(...[...prices].reverse().map(p => {
                const tr = el("tr");
                const store = el("td");
                store.append(chainBadge(p.store_chain));
                tr.append(el("td", "", p.purchase_date ? new Date(p.purchase_date).toLocaleDateString("nb-NO") : "–"), store,
                    el("td", "", describe(p) || "–"), el("td", "", amount(p)),
                    el("td", "", `${kr.format(comparable(p))} ${unitLabel(p)}`));
                return tr;
            }));
            $("stores-section").hidden = false;
        }

        // One store's prices over time as a small line, on the shared axes
        function timeline(list, [t0, t1], [v0, v1]) {
            const W = 240, H = 44, NS = "http://www.w3.org/2000/svg";
            const x = t => 6 + (t - t0) / (t1 - t0) * (W - 12);
            const y = v => H - 6 - (v - v0) / (v1 - v0) * (H - 12);
            const svg = document.createElementNS(NS, "svg");
            svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
            svg.setAttribute("class", "spark");
            svg.setAttribute("role", "img");
            svg.setAttribute("aria-label", `Prisutvikling: ${list.map(p => `${kr.format(comparable(p))} ${unitLabel(p)}`).join(", ")}`);
            const pts = list.filter(p => day(p)).map(p => [x(day(p)), y(comparable(p)), p]);
            if (pts.length > 1) {
                const line = document.createElementNS(NS, "polyline");
                line.setAttribute("points", pts.map(([a, b]) => `${a},${b}`).join(" "));
                svg.append(line);
            }
            for (const [cx, cy, p] of pts) {
                const dot = document.createElementNS(NS, "circle");
                dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("r", 4);
                // Bigger invisible target, so the dot is easy to hover
                const hit = document.createElementNS(NS, "circle");
                hit.setAttribute("cx", cx); hit.setAttribute("cy", cy); hit.setAttribute("r", 12);
                hit.setAttribute("class", "hit");
                hit.addEventListener("pointerenter", e => showTip(e, p));
                hit.addEventListener("pointerleave", () => { $("tip").hidden = true; });
                svg.append(dot, hit);
            }
            return svg;
        }

        // A receipt from the offer's chain, bought while it ran, at the offer's price
        let receipts = [];
        function receiptDuring(o) {
            return receipts.find(p => sameChain(p.store_chain, o.chain) && p.purchase_date >= o.valid_from &&
                p.purchase_date <= o.valid_to && (weighed ? Math.abs(p.price_per_unit - o.per_unit) < 0.005 : Math.abs(each(p) - o.each) < 0.005));
        }

        function showTip(e, p) {
            const tip = $("tip");
            tip.textContent = `${p.purchase_date ? new Date(p.purchase_date).toLocaleDateString("nb-NO") : ""} · ${amount(p)} · ${kr.format(comparable(p))} ${unitLabel(p)}`;
            tip.hidden = false;
            const r = e.target.getBoundingClientRect();
            tip.style.left = `${r.left + r.width / 2 + scrollX}px`;
            tip.style.top = `${r.top + scrollY - 8}px`;
        }

        async function load() {
            if (!name) { $("notice").textContent = "Ingen produkt valgt."; return; }
            try {
                const res = await fetch(`/products/${encodeURIComponent(name)}`);
                if (res.status === 404) {
                    $("name").textContent = name;
                    $("notice").textContent = "Ingen kvitteringer har denne varen ennå.";
                    listButton(name);
                    return;
                }
                if (!res.ok) throw new Error();
                render(await res.json());
            } catch {
                $("notice").textContent = "Kunne ikke hente prisene. Prøv å laste siden på nytt.";
            }
        }
        // This week's flyer offers for the product, if any. Waits for the
        // prices, so a cheaper offer can take over "Billigst nå".
        const offersLoaded = fetch(`/offers?navn=${encodeURIComponent(name)}`).then(r => r.ok ? r.json() : []).catch(() => []);
        load().then(() => offersLoaded).then(mine => {
            if (!mine.length) return;
            // Only flyer prices so far: say where the prices above come from
            if (!cheapest && name) $("notice").textContent = "Ingen kvitteringer ennå. Prisene over er fra kundeavisene.";
            $("offers-list").replaceChildren(...mine.map(o => {
                const li = el("li");
                const line = el("div", "offer-line");
                // A receipt from this chain while the offer ran shows what the
                // offer cost, so "not checked yet" would look like we ignored it
                const seen = o.verdict.kind === "unknown" && receiptDuring(o);
                const tag = seen ? el("span", "verdict-tag seen", "Samme pris som på kvittering") : verdictTag(o);
                line.append(chainBadge(o.chain), el("b", "", offerPrice(o)), tag, el("span", "when", until(o.valid_to)));
                const details = [seen ? el("p", "deal-verdict", `En kvittering fra ${new Date(seen.purchase_date).toLocaleDateString("nb-NO", { day: "numeric", month: "long" })} viser samme pris. Om det er et godt tilbud, kan vi først si når vi har priser fra før tilbudet startet.`) : offerVerdict(o)];
                if (o.brand || o.is_member_price) details.push(el("p", "raw", [o.brand, o.is_member_price ? "medlemspris" : ""].filter(Boolean).join(" · ")));
                if (o.raw_name) details.push(el("p", "raw", `I kundeavisen: «${o.raw_name}»`));
                li.append(line, fold("Detaljer", ...details));
                return li;
            }));
            $("offers-now").hidden = false;

            // Offers are compared per 100 g/ml or per item, like the receipt prices
            const best = mine[0].verdict.per === "stk" ? null : mine.reduce((a, b) => a.per_unit <= b.per_unit ? a : b);
            const offerPer = best && (weighed && best.unit === "g" ? "kr / kg" : `kr / ${best.verdict.per}`);
            const offerValue = best && (offerPer === "kr / kg" ? best.per_unit * 10 : best.per_unit);
            if (best && cheapest && unitLabel(cheapest) === offerPer && offerValue < comparable(cheapest)) {
                $("best").querySelector(".label").textContent = "Billigst nå, på tilbud";
                $("best-chain").replaceChildren(chainBadge(best.chain));
                $("best-price").textContent = offerPrice(best);
                $("best-unit").textContent = `${kr.format(offerValue)} ${offerPer} · ${until(best.valid_to)}`;
                $("best").hidden = false;
            }
        });
    </script>
</body>
</html>
