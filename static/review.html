<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sjekka – Gjennomgå kvittering</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { font-size: 1.5rem; }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
        }
        @media (max-width: 600px) {
            .layout { grid-template-columns: 1fr; }
        }
        img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
            margin-top: 16px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .item-row input { margin: 0; }
        .item-row button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
        }
        .item-row button:hover { color: #e00; }
        #add-item {
            margin-top: 8px;
            background: none;
            border: 1px dashed #ccc;
            border-radius: 6px;
            width: 100%;
            padding: 8px;
            cursor: pointer;
            color: #666;
        }
        #add-item:hover { border-color: #999; color: #333; }
        #save {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        #save:hover { background: #444; }
        #status { margin-top: 12px; color: #444; }
        .items-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 8px;
            font-size: 0.75rem;
            color: #999;
            margin-top: 16px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h1>🧾 Gjennomgå kvittering</h1>

    <div class="layout">
        <div>
            <img id="receipt-img" src="" alt="Kvittering">
        </div>
        <div>
            <label>Butikkjede</label>
            <select id="store-chain">
                <option value="">Velg kjede...</option>
                <option>Rema 1000</option>
                <option>Kiwi</option>
                <option>Meny</option>
                <option>Coop Extra</option>
                <option>Spar</option>
                <option>Joker</option>
                <option>Bunnpris</option>
                <option>Oda</option>
            </select>

            <label>By/sted</label>
            <input type="text" id="store-location" placeholder="f.eks. Grünerløkka">

            <label>Region</label>
            <input type="text" id="region" placeholder="f.eks. Oslo">

            <label>Kjøpsdato</label>
            <input type="date" id="purchase-date">

            <div class="items-header">
                <span>Vare</span>
                <span>Antall</span>
                <span>Enhet</span>
                <span>Pris</span>
                <span></span>
            </div>

            <div id="items"></div>
            <button id="add-item" onclick="addItem()">+ Legg til vare</button>

            <button id="save" onclick="save()">Lagre kvittering</button>
            <p id="status"></p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        document.getElementById('receipt-img').src = `/sjekka/uploads/${id}`;

        // Set today's date as default
        document.getElementById('purchase-date').value = 
            new Date().toISOString().split('T')[0];

        function addItem(name='', qty='', unit='g', price='') {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" placeholder="Vare" value="${name}" class="item-name">
                <input type="number" placeholder="Antall" value="${qty}" class="item-qty" min="0" step="any">
                <select class="item-unit">
                    <option value="g" ${unit==='g'?'selected':''}>g</option>
                    <option value="ml" ${unit==='ml'?'selected':''}>ml</option>
                    <option value="stk" ${unit==='stk'?'selected':''}>stk</option>
                    <option value="l" ${unit==='l'?'selected':''}>l</option>
                    <option value="kg" ${unit==='kg'?'selected':''}>kg</option>
                </select>
                <input type="number" placeholder="Pris" value="${price}" class="item-price" min="0" step="0.01">
                <button onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('items').appendChild(row);
        }

        // Start with 3 empty rows
        addItem(); addItem(); addItem();

        async function save() {
            const storeChain = document.getElementById('store-chain').value;
            const purchaseDate = document.getElementById('purchase-date').value;

            if (!storeChain || !purchaseDate) {
                document.getElementById('status').textContent = 'Fyll inn butikk og dato.';
                return;
            }

            const rows = document.querySelectorAll('.item-row');
            const items = [];

            for (const row of rows) {
                const name = row.querySelector('.item-name').value.trim();
                const qty = parseFloat(row.querySelector('.item-qty').value);
                const unit = row.querySelector('.item-unit').value;
                const price = parseFloat(row.querySelector('.item-price').value);

                if (!name || !price) continue;

                const pricePerUnit = (unit === 'g' || unit === 'ml') && qty > 0
                    ? Math.round((price / qty) * 100 * 100) / 100
    		    : null;

                items.push({
                    raw_name: name,
                    canonical_name: name.toLowerCase(),
                    quantity: qty || 1,
                    unit,
                    price,
                    price_per_unit: pricePerUnit,
                    is_member_price: false
                });
            }

            if (items.length === 0) {
                document.getElementById('status').textContent = 'Legg til minst én vare.';
                return;
            }

            const payload = {
                image_filename: id,
                store_chain: storeChain,
                store_location: document.getElementById('store-location').value,
                region: document.getElementById('region').value,
                purchase_date: purchaseDate,
                items
            };

            const res = await fetch('/sjekka/receipts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('status').textContent = 
                    `✓ Lagret kvittering #${data.receipt_id}`;
            } else {
                document.getElementById('status').textContent = 'Noe gikk galt.';
            }
        }
    </script>
</body>
</html>
