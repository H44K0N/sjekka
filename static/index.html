<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sjekka – Utforsk</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; }

        nav {
            background: #222;
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        nav a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: bold; }

        .toolbar {
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .toolbar button {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .toolbar button.active {
            background: #222;
            color: white;
            border-color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .card .emoji { font-size: 2rem; margin-bottom: 8px; }
        .card .name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
            text-transform: capitalize;
        }
        .card .meta { font-size: 0.72rem; color: #999; margin-bottom: 8px; }
        .card .price { font-size: 1.2rem; font-weight: bold; color: #222; }
        .card .store { font-size: 0.72rem; color: #666; margin-top: 4px; }

        #empty { text-align: center; padding: 60px 20px; color: #999; }
    </style>
</head>
<body>

<nav>
    <a href="/">🧾 Sjekka</a>
</nav>

<div id="hero" style="background:#222; color:white; padding: 28px 20px; text-align:center;">
    <h1 style="font-size:1.4rem; font-weight:600; margin-bottom:8px;">
        Sammen gjør vi matprisene transparente 🧾
    </h1>
    <p style="color:#aaa; font-size:0.85rem; max-width:480px; margin:0 auto 16px;">
        Hver kvittering du deler hjelper folk i hele landet å handle smartere og spare penger.
    </p>
    <div style="display:flex; justify-content:center; gap:32px; margin-top:16px;">
        <div>
            <div id="stat-receipts" style="font-size:2rem; font-weight:700; color:white;">—</div>
            <div style="font-size:0.75rem; color:#aaa; margin-top:2px;">kvitteringer delt</div>
        </div>
        <div>
            <div id="stat-items" style="font-size:2rem; font-weight:700; color:white;">—</div>
            <div style="font-size:0.75rem; color:#aaa; margin-top:2px;">priser registrert</div>
        </div>
    </div>
    <a href="/upload.html" style="display:inline-block; margin-top:20px; background:white; color:#222; padding:10px 24px; border-radius:20px; font-size:0.85rem; font-weight:600; text-decoration:none;">
        + Last opp din kvittering
    </a>
</div>

<div style="padding: 16px 20px; background: white; border-bottom: 1px solid #eee;">
    <input
        type="text"
        id="search"
        placeholder="Søk etter produkt..."
        oninput="renderGrid()"
        style="width:100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 0.9rem; outline: none;"
    >
</div>

<div class="toolbar" id="categories"></div>
<div class="grid" id="grid"></div>
<div id="empty" style="display:none">Ingen produkter funnet.</div>

<script>
const CATEGORY_EMOJI = {
    "Meieri": "🥛",
    "Kjøtt": "🍗",
    "Fisk": "🐟",
    "Frukt og grønt": "🥦",
    "Bakeri": "🍞",
    "Godteri": "🍬",
    "Snacks": "🍿",
    "Drikke": "🥤",
    "Frys": "🧊",
    "Hermetikk": "🥫",
    "Hygiene": "🧴",
    "Rengjøring": "🧹",
    "Annet": "📦",
};

let allProducts = [];
let activeCategory = null;

async function load() {
    const [productsRes, statsRes] = await Promise.all([
        fetch('/products'),
        fetch('/stats')
    ]);
    allProducts = await productsRes.json();
    const stats = await statsRes.json();

    document.getElementById('stat-receipts').textContent = stats.total_receipts;
    document.getElementById('stat-items').textContent = stats.total_items;

    renderCategories();
    renderGrid();
}

function renderCategories() {
    const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
    const toolbar = document.getElementById('categories');
    toolbar.innerHTML = '';

    const all = document.createElement('button');
    all.textContent = 'Alle';
    all.className = activeCategory === null ? 'active' : '';
    all.onclick = () => { activeCategory = null; renderCategories(); renderGrid(); };
    toolbar.appendChild(all);

    categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = `${CATEGORY_EMOJI[cat] || '📦'} ${cat}`;
        btn.className = activeCategory === cat ? 'active' : '';
        btn.onclick = () => { activeCategory = cat; renderCategories(); renderGrid(); };
        toolbar.appendChild(btn);
    });
}

function daysAgo(dateStr) {
    const date = new Date(dateStr);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    date.setHours(0, 0, 0, 0);
    const diff = Math.round((today - date) / (1000 * 60 * 60 * 24));
    if (diff === 0) return 'i dag';
    if (diff === 1) return 'i går';
    return `${diff} dager siden`;
}

function renderGrid() {
    const grid = document.getElementById('grid');
    const query = document.getElementById('search').value.toLowerCase().trim();

    const filtered = allProducts.filter(p => {
        const matchCategory = activeCategory === null || p.category === activeCategory;
        const matchSearch = !query || p.canonical_name.toLowerCase().includes(query);
        return matchCategory && matchSearch;
    });

    document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

    grid.innerHTML = filtered.map(p => {
        const emoji = CATEGORY_EMOJI[p.category] || '📦';

        const perUnit = (() => {
            if (p.price_per_unit && (p.unit === 'g' || p.unit === 'ml')) {
                return `<div class="meta">${p.price_per_unit.toFixed(2)}kr / 100${p.unit === 'ml' ? 'ml' : 'g'}</div>`;
            }
            if (p.unit === 'stk' && p.pack_size > 1) {
                const perStk = (p.total_price / p.pack_size).toFixed(2);
                return `<div class="meta">${perStk}kr / stk</div>`;
            }
            return `<div class="meta">${p.quantity} ${p.unit}</div>`;
        })();

        const displayPrice = (() => {
            if (p.pack_size > 1) {
                return (p.total_price / p.pack_size).toFixed(2);
            }
            return p.total_price?.toFixed(2);
        })();

       return `
    <div class="card">
        <div class="emoji">${emoji}</div>
        <div class="name">${p.canonical_name}</div>
        ${p.brand ? `<div style="font-size:0.72rem; color:#999; margin-bottom:2px;">${p.brand}</div>` : ''}
        ${perUnit}
        <div class="price">${displayPrice}kr</div>
        <div class="store">${p.store_chain} · Oppdatert ${daysAgo(p.purchase_date)}</div>
    </div>
`;
    }).join('');
}

load();
</script>
</body>
</html>
