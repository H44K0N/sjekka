<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sjekka – Takk</title>
    <meta name="theme-color" content="#0d0c0b">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="top">
        <a href="/" class="mark">sjekka</a>
        <nav>
            <a href="/">utforsk</a>
            <a href="/upload.html">last opp</a>
        </nav>
    </header>

    <main class="narrow">
        <section>
            <p class="meta">Mottatt</p>
            <h1>Takk.</h1>
            <p class="lede">Kvitteringen er lastet opp og står i kø for å bli lest. Prisene dukker opp i oversikten om litt.</p>
            <p class="stats" id="queue" hidden></p>
            <div class="actions">
                <a class="button primary" href="/upload.html">Last opp en til <span class="arrow">→</span></a>
                <a class="button" href="/">Se prisene</a>
            </div>
        </section>

        <section>
            <img class="receipt" id="img" alt="Kvitteringen du lastet opp" hidden>
        </section>
    </main>

    <footer>
        <span>sjekka</span>
        <span>Har du sjekka i dag?</span>
    </footer>

    <script>
        // Set by upload.html in this tab; the server never serves photos back.
        let preview = null;
        try { preview = sessionStorage.getItem("sjekka-receipt"); } catch {}
        if (preview && preview.startsWith("data:image/jpeg;")) {
            const img = document.getElementById("img");
            img.addEventListener("load", () => { img.hidden = false; });
            img.src = preview;
        }

        fetch("/stats")
            .then(res => res.ok ? res.json() : null)
            .then(stats => {
                if (!stats || !stats.pending_jobs) return;
                const queue = document.getElementById("queue");
                const b = document.createElement("b");
                b.textContent = stats.pending_jobs;
                queue.append(b, stats.pending_jobs === 1 ? "kvittering i kø" : "kvitteringer i kø");
                queue.hidden = false;
            })
            .catch(() => {});
    </script>
</body>
</html>
