<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sjekka – Takk</title>
    <meta name="theme-color" content="#0d0c0b">
    <meta name="description" content="Kvitteringen blir lest.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sjekka">
    <meta property="og:title" content="Sjekka – Takk">
    <meta property="og:description" content="Kvitteringen blir lest.">
    <meta property="og:url" content="https://sjekka.tischbein.dev/">
    <meta property="og:image" content="https://sjekka.tischbein.dev/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="top">
        <a href="/" class="mark">sjekka</a>
        <nav>
            <a href="/">utforsk</a>
            <a href="/tilbud.html">tilbud</a>
            <a href="/middag.html">middag</a>
            <a href="/handleliste.html">handleliste <span class="list-count" data-list-count hidden></span></a>
            <a href="/upload.html" class="cta">last opp</a>
        </nav>
    </header>

    <main class="narrow">
        <section>
            <p class="meta">Mottatt</p>
            <h1>Takk.</h1>
            <p class="lede" id="lede">Kvitteringen er lastet opp og blir lest nå. Bildet slettes når det er lest.</p>
            <div class="progress" id="progress" aria-live="polite" hidden>
                <p class="state" id="state"></p>
                <p class="found" id="found" hidden></p>
                <ul class="items" id="items" hidden></ul>
            </div>
            <div class="actions">
                <a class="button primary" href="/upload.html">Last opp flere <span class="arrow">→</span></a>
                <a class="button" href="/">Se prisene</a>
            </div>
        </section>

        <section>
            <img class="receipt" id="img" alt="Kvitteringen du lastet opp" hidden>
        </section>
    </main>

    <footer>
        <span>sjekka · <a href="/personvern.html">personvern</a> · <a href="/om.html">om</a></span>
        <span>Har du sjekka i dag?</span>
    </footer>

    <script src="/common.js"></script>
    <script src="/chains.js"></script>
    <script>
        // Set by upload.html in this tab; the server never serves photos back.
        let preview = null;
        try { preview = sessionStorage.getItem("sjekka-receipt"); } catch {}
        if (preview && preview.startsWith("data:image/jpeg;")) {
            const img = document.getElementById("img");
            img.addEventListener("load", () => { img.hidden = false; });
            img.src = preview;
        }

        // Follow the upload until Gemini has read it
        const id = new URLSearchParams(location.search).get("id");
        const $ = i => document.getElementById(i);
        const POLL_MS = 2000, GIVE_UP_MS = 5 * 60 * 1000;
        const started = Date.now();

        function setState(text, kind = "") {
            $("progress").hidden = false;
            $("state").textContent = text;
            $("state").className = `state ${kind}`;
        }

        function showReceipt(receipt) {
            const date = receipt.purchase_date ? new Date(receipt.purchase_date).toLocaleDateString("nb-NO", { day: "numeric", month: "long" }) : null;
            const n = receipt.items.length;
            $("found").replaceChildren(chainBadge(receipt.store_chain),
                el("span", "", [date, `${n} ${n === 1 ? "vare" : "varer"}`].filter(Boolean).join(" · ")));
            $("found").hidden = false;
            $("items").replaceChildren(...receipt.items.map(item => {
                const li = el("li");
                const link = el("a", "", item.canonical_name);
                link.href = `/produkt.html?navn=${encodeURIComponent(item.canonical_name)}`;
                const each = item.pack_size > 1 ? item.total_price / item.pack_size : item.total_price;
                li.append(link, el("span", "", each != null ? `${kr.format(each)} kr` : "–"));
                return li;
            }));
            $("items").hidden = !n;
        }

        async function poll() {
            let job;
            try {
                const res = await fetch(`/jobs/${encodeURIComponent(id)}`);
                if (!res.ok) throw new Error(res.status);
                job = await res.json();
            } catch {
                setState("Fikk ikke kontakt med Sjekka. Prisene dukker opp i oversikten når kvitteringen er lest.");
                return;
            }
            // Read (or already known): the photo is gone, so the lede says so
            if (job.status === "done" || job.status === "duplicate") $("lede").textContent = "Kvitteringen er lest, og bildet er slettet.";
            if (job.status === "done") {
                setState("Lest. Prisene ligger nå i oversikten.", "ok");
                if (job.receipt) showReceipt(job.receipt);
                return;
            }
            if (job.status === "duplicate") return setState("Denne kvitteringen er allerede registrert, så prisene telles ikke to ganger.", "ok");
            if (job.status === "failed") return setState("Kunne ikke lese kvitteringen. Prøv et skarpere bilde der hele kvitteringen er med.", "error");

            if (job.status === "processing") setState("Gemini leser kvitteringen …", "busy");
            else if (job.retrying) setState("Gemini er opptatt. Vi prøver igjen om litt …", "busy");
            else setState(job.queue_position > 1 ? `I kø, nummer ${job.queue_position} …` : "I kø …", "busy");

            if (Date.now() - started < GIVE_UP_MS) setTimeout(poll, POLL_MS);
            else setState("Det tar litt tid. Prisene dukker opp i oversikten når kvitteringen er lest.");
        }
        // A receipt file, maybe a whole purchase history, read part by part
        const batch = new URLSearchParams(location.search).get("batch");
        const BATCH_GIVE_UP_MS = 30 * 60 * 1000;
        const day = d => new Date(d).toLocaleDateString("nb-NO", { day: "numeric", month: "long", year: "numeric" });

        function showBatch(b) {
            if (!b.receipts) { $("found").hidden = true; return; }
            const span = b.from && b.to && b.from !== b.to ? `${day(b.from)} til ${day(b.to)}` : b.from ? day(b.from) : null;
            $("found").replaceChildren(...Object.keys(b.chains).map(chainBadge),
                el("span", "", [`${b.receipts} ${b.receipts === 1 ? "kvittering" : "kvitteringer"}`, `${b.items} varer`, span].filter(Boolean).join(" · ")));
            $("found").hidden = false;
        }

        async function pollBatch() {
            let b;
            try {
                const res = await fetch(`/jobs/batch/${encodeURIComponent(batch)}`);
                if (!res.ok) throw new Error(res.status);
                b = await res.json();
            } catch {
                setState("Fikk ikke kontakt med Sjekka. Prisene dukker opp i oversikten når filen er lest.");
                return;
            }
            showBatch(b);
            if (b.waiting) {
                setState(b.parts > 1 ? `Leser filen: del ${b.read + b.failed + 1} av ${b.parts} …` : "Gemini leser filen …", "busy");
                if (Date.now() - started < BATCH_GIVE_UP_MS) setTimeout(pollBatch, POLL_MS * 2);
                else setState("Det tar litt tid. Prisene dukker opp i oversikten etter hvert som filen blir lest.");
                return;
            }
            const notes = [];
            if (b.duplicates) notes.push(`${b.duplicates} var allerede registrert og telles ikke to ganger.`);
            if (b.failed) notes.push(`${b.failed} av ${b.parts} deler kunne ikke leses.`);
            $("lede").textContent = "Filen er lest. Vi tar vare på den i inntil 12 måneder for å bli bedre til å lese slike filer.";
            if (!b.receipts && !b.duplicates) return setState(["Fant ingen kvitteringer i filen.", ...notes].join(" "), "error");
            setState([b.receipts ? "Lest. Prisene ligger nå i oversikten." : "Lest.", ...notes].join(" "), "ok");
        }

        if (batch) {
            $("lede").textContent = "Filen er lastet opp og blir lest nå. Vi tar vare på den i inntil 12 måneder for å bli bedre til å lese slike filer.";
            pollBatch();
        } else if (id) poll();
    </script>
    <script src="/list.js"></script>
</body>
</html>
