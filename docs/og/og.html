<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Source of static/og.png (link preview image). Regenerate: serve the app, route this page on the same origin, and screenshot it at 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { box-sizing: border-box; height: 630px; padding: 72px 84px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); }
  .ogtop { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 22px; color: var(--soft); }
  h1 { font-size: 84px; line-height: 1.02; margin: 0 0 22px; max-width: 13em; }
  p.sub { font-size: 30px; color: var(--soft); margin: 0; max-width: 28em; }
  .row { display: flex; gap: 14px; align-items: center; }
  .row .chain { height: 46px; padding: 6px 14px; border-radius: 10px; }
  .row .chain img { height: 34px; }
  .row .more { font-family: var(--mono); font-size: 20px; color: var(--soft); margin-left: 8px; }
</style></head><body>
<div class="og">
  <div class="ogtop"><span style="color:var(--text)">sjekka</span><span>sjekka.tischbein.dev</span></div>
  <div><h1>Matpriser fra ekte kvitteringer.</h1><p class="sub">Del kvitteringen din, og se hva varene koster i hver butikk.</p></div>
  <div class="row">
    <span class="chain logo"><img src="/chains/rema-1000.svg"></span>
    <span class="chain logo"><img src="/chains/kiwi.png"></span>
    <span class="chain logo"><img src="/chains/meny.png"></span>
    <span class="chain logo"><img src="/chains/extra.png"></span>
    <span class="chain logo"><img src="/chains/coop-prix.png"></span>
    <span class="more">og flere</span>
  </div>
</div></body></html>
